allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

overrides:
  swrv: 1.1.0
  # Pin h3 to v1: nuxt-csurf still uses the v1 event API (event.req.headers.get), breaks on h3 v2 RC
  h3: 1.15.11
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
