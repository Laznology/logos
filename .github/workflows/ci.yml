name: ci

on: push

env:
  # CI runners have git, but hook installation is pointless here.
  VP_GIT_HOOKS: "0"

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Official Vite+ integration: installs vp + Node.js, resolves the
      # vite-plus version from the project catalog, runs `vp install`, and
      # caches package-manager data through GitHub Actions cache.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: Check (format, lint, types)
        run: vp check

      - name: Typecheck (Nuxt / vue-tsc)
        run: vp run typecheck

      - name: Test
        run: vp test
